name: Deploy Team Problemas de Capibara to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    name: P16 PWA validation and GitHub Pages deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: ESM Syntax Verification
        shell: bash
        run: |
          set -euo pipefail
          find webapp/js -maxdepth 1 -name "*.js" -print0 | while IFS= read -r -d "" file; do
            node --experimental-default-type=module --check "$file"
          done
          node --check webapp/sw.js

      - name: Run Test Suites (P1-P16)
        shell: bash
        run: |
          set -euo pipefail
          tests=(
            webapp/js/admin_panel_test.mjs
            webapp/js/area_theme_test.mjs
            webapp/js/audio_bridge_test.mjs
            webapp/js/audio_engine_test.mjs
            webapp/js/batter_renderer_test.mjs
            webapp/js/combat_effects_test.mjs
            webapp/js/combat_hud_test.mjs
            webapp/js/combat_tactical_test.mjs
            webapp/js/contract_test.mjs
            webapp/js/economy_test.mjs
            webapp/js/gacha_controller_test.mjs
            webapp/js/gacha_engine_test.mjs
            webapp/js/game_modes_test.mjs
            webapp/js/locker_room_test.mjs
            webapp/js/mobile_haptics_test.mjs
            webapp/js/performance_adapter_test.mjs
            webapp/js/pwa_sw_test.mjs
            webapp/js/save_system_test.mjs
            webapp/js/super_swing_cutin_test.mjs
            webapp/js/team_manager_test.mjs
            webapp/js/timing_ring_test.mjs
            webapp/js/tma_bridge_test.mjs
            webapp/js/upgrade_system_test.mjs
            webapp/js/voice_system_test.mjs
            webapp/js/waifu_database_test.mjs
            webapp/js/waifu_dex_test.mjs
            webapp/js/e2e_smoke_test.mjs
          )
          for test_file in "${tests[@]}"; do
            echo "==> ${test_file}"
            node --experimental-default-type=module "${test_file}"
          done

      - name: Run Final Module Tests
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-default-type=module tests/cmsProductionBundle.test.mjs
          node --experimental-default-type=module tests/audioManager.test.mjs
          node --experimental-default-type=module tests/leaderboard.test.mjs

      - name: Prepare Pages Artifact
        shell: bash
        run: |
          set -euo pipefail
          touch webapp/.nojekyll
          echo "build_timestamp=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" > webapp/build_info.txt

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './webapp'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
