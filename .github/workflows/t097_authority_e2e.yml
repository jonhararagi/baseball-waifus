name: T097 Server Authority Reward E2E

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "backend/**"
      - "webapp/js/combat_core.js"
      - "webapp/js/reward_authority.js"
      - "webapp/js/reward_pipeline.js"
      - "webapp/js/reward_resolver.js"
      - "webapp/js/player_meta_state.js"
      - "webapp/js/player_meta_persistence_adapter.js"
      - ".github/workflows/t097_authority_e2e.yml"

permissions:
  contents: read

jobs:
  t097-authority-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NODE_ENV: test
      T097_EVIDENCE_PATH: artifacts/t097-authority-e2e.json
    steps:
      - name: Checkout isolated PR revision
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package.json

      - name: Record runtime
        run: |
          node --version
          npm --version

      - name: Install backend runtime dependencies
        run: npm --prefix backend install --ignore-scripts --no-audit --no-fund --package-lock=false

      - name: Run backend and T097 server-authority contract tests
        run: |
          mkdir -p artifacts
          npm --prefix backend test

      - name: Upload structured T097 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t097-server-authority-e2e
          path: artifacts/t097-authority-e2e.json
          if-no-files-found: warn
