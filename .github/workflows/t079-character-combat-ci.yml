name: T079 Character-Combat 2.5D CI
on:
  push:
    branches:
      - main
    paths:
      - "webapp/js/combat.js"
      - "webapp/js/combat_stage.js"
      - "webapp/js/combat_stage_t079_test.mjs"
      - "webapp/js/combat_presentation_director.js"
  workflow_dispatch:
jobs:
  t079:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax and T079 cinematic contract
        run: |
          set -euo pipefail
          node --check webapp/js/combat_stage.js
          node --check webapp/js/combat.js
          node --check webapp/js/combat_presentation_director.js
          node webapp/js/combat_stage_t079_test.mjs
