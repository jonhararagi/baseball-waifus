name: T078 Combat Stage CI
on:
  push:
    branches:
      - main
    paths:
      - "webapp/js/combat.js"
      - "webapp/js/combat_stage.js"
      - "webapp/js/combat_stage_test.mjs"
      - "webapp/js/combat_presentation_director.js"
      - "webapp/js/combat_presentation_director_test.mjs"
  workflow_dispatch:
jobs:
  stage-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax and contract tests
        run: |
          set -euo pipefail
          node --check webapp/js/combat_stage.js
          node --check webapp/js/combat_presentation_director.js
          node --check webapp/js/combat.js
          node webapp/js/combat_stage_test.mjs
          node webapp/js/combat_presentation_director_test.mjs
