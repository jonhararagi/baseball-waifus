name: Combat Vertical Slice Tests

on:
  push:
    branches:
      - main
    paths:
      - "webapp/js/combat*.js"
      - "webapp/js/kytos_combat_vertical_slice.js"
      - "webapp/js/kytos_combat_vertical_slice_test.mjs"
      - "webapp/js/kytos_combat_presentation.js"
      - "webapp/js/kytos_combat_presentation_test.mjs"
      - "webapp/js/kytos_combat_demo.js"
      - "webapp/js/kytos_combat_demo_test.mjs"
      - "webapp/js/kytos_tactical_decision.js"
      - "webapp/js/kytos_tactical_decision_test.mjs"
      - "webapp/js/buffer_energy_creator.js"
      - "webapp/js/buffer_combat_adapter.js"
      - "webapp/js/buffer_energy_creator_presentation.js"
      - "webapp/js/buffer_energy_creator_test.mjs"
      - "webapp/js/buffer_demo.html"
      - "webapp/js/healer_defensive_support.js"
      - "webapp/js/healer_combat_adapter.js"
      - "webapp/js/healer_defensive_presentation.js"
      - "webapp/js/healer_defensive_test.mjs"
      - "webapp/js/healer_demo.html"
      - "webapp/js/debuffer_disruptor.js"
      - "webapp/js/debuffer_combat_adapter.js"
      - "webapp/js/debuffer_disruptor_presentation.js"
      - "webapp/js/debuffer_disruptor_test.mjs"
      - "webapp/js/debuffer_demo.html"
      - "webapp/js/batter_leader.js"
      - "webapp/js/batter_combat_adapter.js"
      - "webapp/js/batter_leader_presentation.js"
      - "webapp/js/batter_leader_test.mjs"
      - "webapp/js/batter_demo.html"
      - "webapp/js/student_4v4_orchestrator.js"
      - "webapp/js/student_4v4_combat_adapter.js"
      - "webapp/js/student_4v4_presentation.js"
      - "webapp/js/student_4v4_orchestrator_test.mjs"
      - "webapp/js/student_4v4_integration.js"
      - "webapp/js/student_4v4_integration_test.mjs"
      - "webapp/js/student_4v4_integration_presentation.js"
      - "webapp/js/student_4v4_battle_state.js"
      - "webapp/js/student_4v4_battle_state_presentation.js"
      - "webapp/js/student_4v4_battle_state_test.mjs"
      - "webapp/js/student_4v4_presentation_orchestrator.js"
      - "webapp/js/student_4v4_presentation_orchestrator_test.mjs"
      - "webapp/student_4v4_demo.html"
      - "docs/student-4v4-orchestration.md"
      - "webapp/js/app.js"
      - "webapp/index.html"
      - "webapp/css/styles.css"
      - "webapp/js/timing_ring.js"
      - "webapp/js/batter_renderer.js"
      - "webapp/js/batter_renderer_test.mjs"
      - ".github/workflows/combat-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  combat-tests:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run combat vertical slice tests
        shell: bash
        run: |
          set -euo pipefail
          node --version
          node --experimental-default-type=module webapp/js/kytos_combat_vertical_slice_test.mjs
          node --experimental-default-type=module webapp/js/kytos_combat_presentation_test.mjs
          node --experimental-default-type=module webapp/js/kytos_combat_demo_test.mjs
          node --experimental-default-type=module webapp/js/kytos_tactical_decision_test.mjs
          node --experimental-default-type=module webapp/js/combat_core_test.mjs
          node --experimental-default-type=module webapp/js/combat_effects_test.mjs
          node --experimental-default-type=module webapp/js/batter_renderer_test.mjs
          node --experimental-default-type=module webapp/js/buffer_energy_creator_test.mjs
          node --experimental-default-type=module webapp/js/healer_defensive_test.mjs
          node --experimental-default-type=module webapp/js/debuffer_disruptor_test.mjs
          node --experimental-default-type=module webapp/js/student_4v4_orchestrator_test.mjs
          node --experimental-default-type=module webapp/js/student_4v4_integration_test.mjs
          node --experimental-default-type=module webapp/js/batter_leader_test.mjs
          node --experimental-default-type=module webapp/js/student_4v4_battle_state_test.mjs
          node --experimental-default-type=module webapp/js/student_4v4_presentation_orchestrator_test.mjs

      - name: Validate combat syntax
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-default-type=module --check webapp/js/kytos_combat_vertical_slice.js
          node --experimental-default-type=module --check webapp/js/kytos_combat_presentation.js
          node --experimental-default-type=module --check webapp/js/combat.js
          node --experimental-default-type=module --check webapp/js/combat_core.js
          node --experimental-default-type=module --check webapp/js/timing_ring.js
          node --experimental-default-type=module --check webapp/js/kytos_combat_demo.js
          node --experimental-default-type=module --check webapp/js/kytos_tactical_decision.js
          node --experimental-default-type=module --check webapp/js/buffer_energy_creator.js
          node --experimental-default-type=module --check webapp/js/buffer_combat_adapter.js
          node --experimental-default-type=module --check webapp/js/buffer_energy_creator_presentation.js
          node --experimental-default-type=module --check webapp/js/healer_defensive_support.js
          node --experimental-default-type=module --check webapp/js/healer_combat_adapter.js
          node --experimental-default-type=module --check webapp/js/healer_defensive_presentation.js
          node --experimental-default-type=module --check webapp/js/debuffer_disruptor.js
          node --experimental-default-type=module --check webapp/js/debuffer_combat_adapter.js
          node --experimental-default-type=module --check webapp/js/debuffer_disruptor_presentation.js
          node --experimental-default-type=module --check webapp/js/batter_leader.js
          node --experimental-default-type=module --check webapp/js/batter_combat_adapter.js
          node --experimental-default-type=module --check webapp/js/batter_leader_presentation.js
          node --experimental-default-type=module --check webapp/js/student_4v4_orchestrator.js
          node --experimental-default-type=module --check webapp/js/student_4v4_combat_adapter.js
          node --experimental-default-type=module --check webapp/js/student_4v4_presentation.js
          node --experimental-default-type=module --check webapp/js/student_4v4_integration.js
          node --experimental-default-type=module --check webapp/js/student_4v4_integration_presentation.js
          node --experimental-default-type=module --check webapp/js/student_4v4_battle_state.js
          node --experimental-default-type=module --check webapp/js/student_4v4_battle_state_presentation.js
          node --experimental-default-type=module --check webapp/js/student_4v4_presentation_orchestrator.js
          node --experimental-default-type=module --check webapp/js/app.js
