name: T081 Cinematic Ultimate Choreography Foundation CI
on:
  push:
    branches:
      - main
    paths:
      - "webapp/js/combat.js"
      - "webapp/js/app.js"
      - "webapp/js/combat_stage.js"
      - "webapp/js/combat_presentation_director.js"
      - "webapp/js/ultimate_staging_t081_test.mjs"
  workflow_dispatch:
jobs:
  t081:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: T081 syntax and contract test
        run: |
          set -euo pipefail
          node --check webapp/js/combat_stage.js
          node --check webapp/js/combat_presentation_director.js
          node --check webapp/js/combat.js
          node --check webapp/js/app.js
          node --check webapp/js/ultimate_staging_t081_test.mjs
          node webapp/js/ultimate_staging_t081_test.mjs
