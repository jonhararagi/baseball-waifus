name: Player Meta Persistence Tests

on:
  push:
    branches:
      - main
    paths:
      - "webapp/js/player_meta_state.js"
      - "webapp/js/player_meta_authority_test.mjs"
      - "webapp/js/player_meta_persistence_adapter.js"
      - "webapp/js/player_meta_persistence_adapter_test.mjs"
      - "webapp/js/player_meta_roster_integration.js"
      - "webapp/js/player_meta_roster_integration_test.mjs"
      - "webapp/js/team_manager.js"
      - "docs/player-meta-authority.md"
      - "docs/meta-game-architecture.md"
      - "docs/presentation-2d-architecture.md"
      - "webapp/js/reward_resolver.js"
      - "webapp/js/player_meta_reward_adapter.js"
      - "webapp/js/reward_meta_foundation_test.mjs"
      - "webapp/js/presentation_event_contract.js"
      - "webapp/js/meta_presentation_contract_test.mjs"
      - "webapp/js/reward_pipeline.js"
      - "webapp/js/reward_pipeline_test.mjs"
      - "webapp/js/player_meta_state.js"
      - "webapp/js/player_meta_reward_adapter.js"
      - "webapp/js/app.js"
      - ".github/workflows/player-meta-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  player-meta-tests:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run player meta tests
        shell: bash
        run: |
          set -euo pipefail
          node --version
          node --experimental-default-type=module webapp/js/player_meta_authority_test.mjs
          node --experimental-default-type=module webapp/js/player_meta_persistence_adapter_test.mjs
          node --experimental-default-type=module webapp/js/player_meta_roster_integration_test.mjs
          node --experimental-default-type=module webapp/js/reward_meta_foundation_test.mjs
          node --experimental-default-type=module webapp/js/meta_presentation_contract_test.mjs
          node --experimental-default-type=module webapp/js/reward_pipeline_test.mjs

      - name: Validate player meta syntax
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-default-type=module --check webapp/js/player_meta_state.js
          node --experimental-default-type=module --check webapp/js/player_meta_authority_test.mjs
          node --experimental-default-type=module --check webapp/js/player_meta_persistence_adapter.js
          node --experimental-default-type=module --check webapp/js/player_meta_persistence_adapter_test.mjs
          node --experimental-default-type=module --check webapp/js/player_meta_roster_integration.js
          node --experimental-default-type=module --check webapp/js/player_meta_roster_integration_test.mjs
          node --experimental-default-type=module --check webapp/js/team_manager.js
          node --experimental-default-type=module --check webapp/js/reward_resolver.js
          node --experimental-default-type=module --check webapp/js/player_meta_reward_adapter.js
          node --experimental-default-type=module --check webapp/js/reward_meta_foundation_test.mjs
          node --experimental-default-type=module --check webapp/js/presentation_event_contract.js
          node --experimental-default-type=module --check webapp/js/meta_presentation_contract_test.mjs
          node --experimental-default-type=module --check webapp/js/reward_pipeline.js
          node --experimental-default-type=module --check webapp/js/reward_pipeline_test.mjs
          node --experimental-default-type=module --check webapp/js/app.js
