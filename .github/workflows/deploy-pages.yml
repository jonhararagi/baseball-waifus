name: Baseball Waifus Telegram Mini App

on:
  push:
    branches:
      - main
    paths:
      - "data/characters_queue.json"
      - "tools/generate_production_artwork.py"
      - "webapp/**"
      - "data/game_schemas_recycled.json"
      - "assets/production/**"
      - "assets/characters/approved/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.sha }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install artwork processing dependency
        run: python -m pip install --disable-pip-version-check --no-input Pillow

      - name: Ensure production anime artwork is available
        shell: bash
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail

          production_assets_complete() {
            test -s assets/production/cards/bw001--normal.jpg
            test -s assets/production/cards/bw002--normal.jpg
            test -s assets/production/sprites/bw001_idle.png
            test -s assets/production/sprites/bw002_idle.png
            for id in bw021 bw022 bw023 bw024 bw025 bw026 bw027 bw028 bw029 bw030; do
              test -s "assets/production/cards/${id}--normal.jpg"
              test -s "assets/production/sprites/${id}_idle.png"
              test -s "assets/production/sprites/${id}_attack.png"
              test -s "assets/production/sprites/${id}_hit.png"
            done
          }

          if production_assets_complete; then
            echo "Committed production artwork fixtures are complete; skipping remote artwork generation."
          else
            echo "Production artwork fixtures are incomplete; invoking the configured generator."
            python tools/generate_production_artwork.py
          fi

      - name: Verify raster production assets
        shell: bash
        run: |
          set -euo pipefail
          test -s assets/production/cards/bw001--normal.jpg
          test -s assets/production/cards/bw002--normal.jpg
          test -s assets/production/sprites/bw001_idle.png
          test -s assets/production/sprites/bw002_idle.png
          for id in bw021 bw022 bw023 bw024 bw025 bw026 bw027 bw028 bw029 bw030; do
            test -s "assets/production/cards/${id}--normal.jpg"
            test -s "assets/production/sprites/${id}_idle.png"
            test -s "assets/production/sprites/${id}_attack.png"
            test -s "assets/production/sprites/${id}_hit.png"
          done
          test ! -e assets/production/cards/bw001.svg
          test ! -e assets/production/cards/bw002.svg
          test ! -e assets/production/sprites/bw001.svg
          test ! -e assets/production/sprites/bw002.svg

      - name: Commit generated production artwork
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/production/cards assets/production/sprites
          if git diff --cached --quiet; then
            echo "No production artwork changes to commit."
          else
            git commit -m "art: replace bw001 and bw002 production vectors with raster anime assets"
            git push origin HEAD:main
          fi

      - name: Validate required frontend structure
        shell: bash
        run: |
          set -euo pipefail
          test -s webapp/index.html
          test -s webapp/css/style.css
          test -s webapp/js/app.js
          test -s webapp/js/combat.js
          test -s webapp/js/api.js
          test -s webapp/js/audio_bridge.js
          test -s webapp/js/audio.js
          test -s webapp/js/gacha_controller.js
          test -s webapp/js/gacha_controller_test.mjs
          test -s webapp/js/gallery.js
          test -s webapp/js/economy_test.mjs
          test -s webapp/js/haptics_bridge.js
          test -s webapp/js/area_theme_manager.js
          test -s webapp/js/area_theme_test.mjs
          test -s webapp/js/batter_renderer.js
          test -s webapp/js/batter_renderer_test.mjs
          test -s webapp/js/combat_effects.js
          test -s webapp/js/combat_effects_test.mjs
          test -s webapp/js/combat_hud.js
          test -s webapp/js/gacha_engine.js
          test -s webapp/js/gacha_engine_test.mjs
          test -s webapp/js/waifu_dex.js
          test -s webapp/js/waifu_dex_test.mjs
          test -s webapp/js/card_renderer.js
          test -s webapp/js/share_bridge.js
          test -s webapp/js/economy.js
          test -s webapp/js/tma_bridge_test.mjs
          test -s webapp/js/audio_bridge_test.mjs
          test -s data/game_schemas_recycled.json
          test -d assets/production/sprites
          test -d assets/production/cards
          test -s assets/characters/approved/manifest.json
          python3 -c 'import json; from pathlib import Path; m=json.loads(Path("assets/characters/approved/manifest.json").read_text()); assert m.get("status_contract")==["MISSING","DRAFT","PROCESSED","APPROVED"]; [(lambda p: (_ for _ in ()).throw(AssertionError(f"Missing project art: {cid} -> {p}")) if not p.is_file() or p.stat().st_size == 0 else None)(Path(e["runtime_path"].removeprefix("./"))) for cid,e in m.get("assets",{}).items() if e.get("status") in {"PROCESSED","APPROVED"}]'
          test -s assets/production/cards/bw001--normal.jpg
          test -s assets/production/cards/bw002--normal.jpg
          test -s assets/production/sprites/bw001_idle.png
          test -s assets/production/sprites/bw002_idle.png
          for id in bw021 bw022 bw023 bw024 bw025 bw026 bw027 bw028 bw029 bw030; do
            test -s "assets/production/cards/${id}--normal.jpg"
            test -s "assets/production/sprites/${id}_idle.png"
            test -s "assets/production/sprites/${id}_attack.png"
            test -s "assets/production/sprites/${id}_hit.png"
          done
          ! grep -R --fixed-strings "./assets/demo-characters/" webapp/js/app.js webapp/js/combat.js

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Prepare runtime data for integration tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p webapp/data
          cp data/characters_queue.json webapp/data/characters_queue.json
          cp data/game_schemas_recycled.json webapp/data/game_schemas_recycled.json
          test -s webapp/data/characters_queue.json
          test -s webapp/data/game_schemas_recycled.json

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --version
          node --experimental-default-type=module --check webapp/js/api.js
          node --experimental-default-type=module --check webapp/js/reaction_rules.js
          node --experimental-default-type=module webapp/js/reaction_rules_test.mjs
          node --experimental-default-type=module --check webapp/js/narrative_runtime.js
          node --experimental-default-type=module webapp/js/narrative_runtime_test.mjs
          node --experimental-default-type=module --check webapp/js/narrative_presentation.js
          node --experimental-default-type=module webapp/js/narrative_presentation_test.mjs
          node --experimental-default-type=module webapp/js/narrative_team11_test.mjs
          node --experimental-default-type=module --check webapp/js/narrative_arc0_team11_choice.js
          node --experimental-default-type=module --check webapp/js/narrative_team11_choice_presentation.js
          node --experimental-default-type=module webapp/js/narrative_team11_choice_test.mjs
          node --experimental-default-type=module --check webapp/js/character_detail_view.js
          node --experimental-default-type=module --check webapp/js/character_story_bindings.js
          node --experimental-default-type=module webapp/js/character_narrative_integration_test.mjs
          node --experimental-default-type=module webapp/js/character_relationship_integration_test.mjs
          node --experimental-default-type=module webapp/js/canonical_character_availability_test.mjs
          node --experimental-default-type=module --check webapp/js/combat.js
          node --experimental-default-type=module --check webapp/js/app.js
          node --experimental-default-type=module --check webapp/js/audio_bridge.js
          node --experimental-default-type=module --check webapp/js/audio.js
          node --experimental-default-type=module --check webapp/js/gacha_controller.js
          node --experimental-default-type=module --check webapp/js/gallery.js
          node --experimental-default-type=module --check webapp/js/haptics_bridge.js
          node --experimental-default-type=module --check webapp/js/area_theme_manager.js
          node --experimental-default-type=module webapp/js/area_theme_test.mjs
          node --experimental-default-type=module --check webapp/js/batter_renderer.js
          node --experimental-default-type=module webapp/js/batter_renderer_test.mjs
          node --experimental-default-type=module --check webapp/js/combat_effects.js
          node --experimental-default-type=module webapp/js/combat_effects_test.mjs
          node --experimental-default-type=module --check webapp/js/combat_hud.js
          node --experimental-default-type=module --check webapp/js/gacha_engine.js
          node --experimental-default-type=module webapp/js/gacha_engine_test.mjs
          node --experimental-default-type=module --check webapp/js/waifu_dex.js
          node --experimental-default-type=module webapp/js/waifu_dex_test.mjs
          node --experimental-default-type=module --check webapp/js/card_renderer.js
          node --experimental-default-type=module --check webapp/js/share_bridge.js
          node --experimental-default-type=module --check webapp/js/economy.js
          node --experimental-default-type=module webapp/js/economy_test.mjs
          node --experimental-default-type=module webapp/js/tma_bridge_test.mjs
          node --experimental-default-type=module webapp/js/gacha_controller_test.mjs
          node --experimental-default-type=module webapp/js/gacha_player_meta_migration_test.mjs
          node --experimental-default-type=module webapp/js/audio_bridge_test.mjs
          node --experimental-default-type=module webapp/js/contract_test.mjs

      - name: Validate P0 runtime integration
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-default-type=module webapp/js/contract_test.mjs
          node --experimental-default-type=module webapp/js/pwa_sw_test.mjs
          node --experimental-default-type=module webapp/js/save_system_test.mjs
          node --experimental-default-type=module webapp/js/e2e_smoke_test.mjs

      - name: Prepare static site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site
          cp -R webapp/. site/
          mkdir -p site/assets/characters/expressions
          cp -R assets/characters/expressions/. site/assets/characters/expressions/
          mkdir -p site/assets/characters/approved
          cp -R assets/characters/approved/. site/assets/characters/approved/
          mkdir -p site/data
          cp data/game_schemas_recycled.json site/data/game_schemas_recycled.json
          cp data/characters_queue.json site/data/characters_queue.json
          test -s site/data/characters_queue.json
          test -s site/data/game_schemas_recycled.json
          mkdir -p site/assets/production/sprites site/assets/production/cards
          cp -R assets/production/. site/assets/production/ || true

          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("site/assets/production")
          allowed = {".png", ".jpg", ".jpeg", ".webp", ".avif", ".svg"}

          def collect(folder):
              items = []
              base = root / folder
              for path in sorted(base.rglob("*")):
                  if path.is_file() and path.suffix.lower() in allowed:
                      descriptor = {
                          "id": path.stem,
                          "path": "./assets/production/%s" % path.relative_to(root).as_posix()
                      }
                      if folder == "cards":
                          descriptor["card_hd_url"] = descriptor["path"]
                      else:
                          descriptor["sprite_url"] = descriptor["path"]
                      items.append(descriptor)
              return items

          manifest = {
              "version": 2,
              "sprites": collect("sprites"),
              "cards": collect("cards")
          }

          (root / "manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )
          print(json.dumps(manifest, ensure_ascii=False, indent=2))
          PY

      - name: Setup Node.js 22 for Browser QA
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: T073 Character Presentation Browser QA
        shell: bash
        env:
          T072_SITE_DIR: site
          T072_EVIDENCE_DIR: browser-evidence/T073/${{ github.sha }}/${{ github.run_id }}
          T073_EVIDENCE_DIR: browser-evidence/T073/${{ github.sha }}/${{ github.run_id }}
          T073_PRESENTATION: "1"
        run: |
          set -euo pipefail
          mkdir -p "$T073_EVIDENCE_DIR"

          BROWSER_BIN=""
          for candidate in google-chrome chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then
              BROWSER_BIN="$(command -v "$candidate")"
              break
            fi
          done

          if [ -z "$BROWSER_BIN" ]; then
            echo "BROWSER AUTOMATION = NOT_RUN // no supported Chrome/Chromium binary on runner"
            printf '%s\n' '{"task":"T073","browser_automation":"NOT_RUN","reason":"No supported Chrome/Chromium binary on runner"}' > "$T073_EVIDENCE_DIR/t073-browser-not-run.json"
            exit 0
          fi

          echo "BROWSER_BIN = $BROWSER_BIN"
          BROWSER_BIN="$BROWSER_BIN" node webapp/js/character_journey_browser_probe.mjs

      - name: Upload T072 browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t072-browser-evidence-${{ github.sha }}-${{ github.run_id }}
          path: browser-evidence/T072/${{ github.sha }}/${{ github.run_id }}/
          if-no-files-found: warn

      - name: T072 Character Journey Regression Suites
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-default-type=module webapp/js/character_art_registry_test.mjs
          node --experimental-default-type=module --check webapp/js/art_panel.js
          node --experimental-default-type=module webapp/js/locker_room_test.mjs
          node --experimental-default-type=module webapp/js/reaction_rules_test.mjs
          node --experimental-default-type=module webapp/js/voice_system_test.mjs
          node --experimental-default-type=module webapp/js/home_view_test.mjs
          node --experimental-default-type=module webapp/js/waifu_dex_test.mjs
          node --experimental-default-type=module webapp/js/roster_panel_test.mjs
          node --experimental-default-type=module webapp/js/player_meta_authority_test.mjs
          node --experimental-default-type=module webapp/js/player_meta_progression_test.mjs
          node --experimental-default-type=module webapp/js/player_meta_roster_integration_test.mjs
          node --experimental-default-type=module webapp/js/player_meta_roster_rehydration_test.mjs

      - name: Upload T073 browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t073-browser-evidence-${{ github.sha }}-${{ github.run_id }}
          path: browser-evidence/T073/${{ github.sha }}/${{ github.run_id }}/
          if-no-files-found: warn

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
