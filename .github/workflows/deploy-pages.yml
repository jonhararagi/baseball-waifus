name: Baseball Waifus Telegram Mini App

on:
  push:
    branches:
      - main
    paths:
      - "data/characters_queue.json"
      - "tools/generate_production_artwork.py"
      - "webapp/**"
      - "data/game_schemas_recycled.json"
      - "assets/production/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install artwork processing dependency
        run: python -m pip install --disable-pip-version-check --no-input Pillow

      - name: Generate production anime artwork
        env:
          PYTHONUNBUFFERED: "1"
        run: python tools/generate_production_artwork.py

      - name: Verify raster production assets
        shell: bash
        run: |
          set -euo pipefail
          test -s assets/production/cards/bw001--normal.jpg
          test -s assets/production/cards/bw002--normal.jpg
          test -s assets/production/sprites/bw001_idle.png
          test -s assets/production/sprites/bw002_idle.png
          for id in bw021 bw022 bw023 bw024 bw025 bw026 bw027 bw028 bw029 bw030; do
            test -s "assets/production/cards/${id}--normal.jpg"
            test -s "assets/production/sprites/${id}_idle.png"
            test -s "assets/production/sprites/${id}_attack.png"
            test -s "assets/production/sprites/${id}_hit.png"
          done
          test ! -e assets/production/cards/bw001.svg
          test ! -e assets/production/cards/bw002.svg
          test ! -e assets/production/sprites/bw001.svg
          test ! -e assets/production/sprites/bw002.svg

      - name: Commit generated production artwork
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/production/cards assets/production/sprites
          if git diff --cached --quiet; then
            echo "No production artwork changes to commit."
          else
            git commit -m "art: replace bw001 and bw002 production vectors with raster anime assets"
            git push origin HEAD:main
          fi

      - name: Validate required frontend structure
        shell: bash
        run: |
          set -euo pipefail
          test -s webapp/index.html
          test -s webapp/css/style.css
          test -s webapp/js/app.js
          test -s webapp/js/combat.js
          test -s webapp/js/api.js
          test -s webapp/js/audio_bridge.js
          test -s webapp/js/audio.js
          test -s webapp/js/gacha_controller.js
          test -s webapp/js/gacha_controller_test.mjs
          test -s webapp/js/audio_bridge_test.mjs
          test -s data/game_schemas_recycled.json
          test -d assets/production/sprites
          test -d assets/production/cards
          test -s assets/production/cards/bw001--normal.jpg
          test -s assets/production/cards/bw002--normal.jpg
          test -s assets/production/sprites/bw001_idle.png
          test -s assets/production/sprites/bw002_idle.png
          for id in bw021 bw022 bw023 bw024 bw025 bw026 bw027 bw028 bw029 bw030; do
            test -s "assets/production/cards/${id}--normal.jpg"
            test -s "assets/production/sprites/${id}_idle.png"
            test -s "assets/production/sprites/${id}_attack.png"
            test -s "assets/production/sprites/${id}_hit.png"
          done
          ! grep -R --fixed-strings "./assets/demo-characters/" webapp/js/app.js webapp/js/combat.js

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --version
          node --experimental-default-type=module --check webapp/js/api.js
          node --experimental-default-type=module --check webapp/js/combat.js
          node --experimental-default-type=module --check webapp/js/app.js
          node --experimental-default-type=module --check webapp/js/audio_bridge.js
          node --experimental-default-type=module --check webapp/js/audio.js
          node --experimental-default-type=module --check webapp/js/gacha_controller.js
          node --experimental-default-type=module webapp/js/gacha_controller_test.mjs
          node --experimental-default-type=module webapp/js/audio_bridge_test.mjs
          node --experimental-default-type=module webapp/js/contract_test.mjs

      - name: Prepare static site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site
          cp -R webapp/. site/
          mkdir -p site/data
          cp data/game_schemas_recycled.json site/data/game_schemas_recycled.json
          mkdir -p site/assets/production/sprites site/assets/production/cards
          cp -R assets/production/sprites/. site/assets/production/sprites/ || true
          cp -R assets/production/cards/. site/assets/production/cards/ || true

          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("site/assets/production")
          allowed = {".png", ".jpg", ".jpeg", ".webp", ".avif"}

          def collect(folder):
              items = []
              base = root / folder
              for path in sorted(base.rglob("*")):
                  if path.is_file() and path.suffix.lower() in allowed:
                      descriptor = {
                          "id": path.stem,
                          "path": "./assets/production/%s" % path.relative_to(root).as_posix()
                      }
                      if folder == "cards":
                          descriptor["card_hd_url"] = descriptor["path"]
                      else:
                          descriptor["sprite_url"] = descriptor["path"]
                      items.append(descriptor)
              return items

          manifest = {
              "version": 2,
              "sprites": collect("sprites"),
              "cards": collect("cards")
          }

          (root / "manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )
          print(json.dumps(manifest, ensure_ascii=False, indent=2))
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
