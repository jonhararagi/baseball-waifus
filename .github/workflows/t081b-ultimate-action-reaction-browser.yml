name: T081-B Ultimate Action Reaction Browser QA
on:
  push:
    branches:
      - main
    paths:
      - "webapp/js/app.js"
      - "webapp/js/combat.js"
      - "webapp/js/combat_stage.js"
      - "webapp/js/combat_presentation_director.js"
      - "webapp/js/batter_renderer.js"
      - "webapp/js/ultimate_action_t081b_browser_probe.mjs"
      - "webapp/js/ultimate_action_t081b_test.mjs"
      - "webapp/css/styles.css"
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Prepare runtime data
        run: |
          set -euo pipefail
          mkdir -p webapp/data
          cp data/characters_queue.json webapp/data/characters_queue.json
          cp data/game_schemas_recycled.json webapp/data/game_schemas_recycled.json
      - name: Locate Chrome
        run: |
          set -euo pipefail
          for candidate in google-chrome chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then
              echo "BROWSER_BIN=$(command -v "$candidate")" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          exit 1
      - name: Run T081-B real browser proof
        env:
          T072_SITE_DIR: webapp
        run: |
          set -euo pipefail
          export T072_EVIDENCE_DIR="browser-evidence/T081-B/$GITHUB_SHA/$GITHUB_RUN_ID"
          mkdir -p "$T072_EVIDENCE_DIR"
          node --check webapp/js/ultimate_action_t081b_browser_probe.mjs
          node webapp/js/ultimate_action_t081b_browser_probe.mjs
      - name: Upload T081-B evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t081b-ultimate-action-reaction-evidence
          path: browser-evidence/T081-B/
          if-no-files-found: warn
