name: Gacha Player Meta Integration Tests

on:
  push:
    branches:
      - main
    paths:
      - "webapp/js/gacha_controller.js"
      - "webapp/js/gacha_controller_runtime.js"
      - "data/characters_queue.json"
      - "webapp/js/canonical_character_availability_test.mjs"
      - "webapp/js/gacha_player_meta_integration.js"
      - "webapp/js/gacha_player_meta_integration_test.mjs"
      - "webapp/js/player_meta_state.js"
      - "webapp/js/player_meta_authority_test.mjs"
      - "webapp/js/player_meta_persistence_adapter.js"
      - "webapp/js/player_meta_persistence_adapter_test.mjs"
      - "docs/gacha-player-meta-integration.md"
      - "webapp/js/player_meta_roster_integration.js"
      - "webapp/js/player_meta_roster_rehydration_test.mjs"
      - "webapp/js/persistence_authority_test.mjs"
      - "webapp/js/team_manager.js"
      - ".github/workflows/gacha-player-meta-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gacha-player-meta:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run Player Meta authority and persistence tests
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-default-type=module webapp/js/player_meta_authority_test.mjs
          node --experimental-default-type=module webapp/js/player_meta_persistence_adapter_test.mjs
          node --experimental-default-type=module webapp/js/persistence_authority_test.mjs
          node --experimental-default-type=module webapp/js/gacha_player_meta_migration_test.mjs

      - name: Run Gacha / Player Meta integration test
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-default-type=module webapp/js/gacha_player_meta_integration_test.mjs
          node --experimental-default-type=module webapp/js/canonical_character_availability_test.mjs
          node --experimental-default-type=module webapp/js/player_meta_roster_rehydration_test.mjs
          node --experimental-default-type=module webapp/js/player_meta_roster_integration_test.mjs

      - name: Validate integration syntax
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-default-type=module --check webapp/js/player_meta_state.js
          node --experimental-default-type=module --check webapp/js/player_meta_authority_test.mjs
          node --experimental-default-type=module --check webapp/js/player_meta_persistence_adapter.js
          node --experimental-default-type=module --check webapp/js/player_meta_persistence_adapter_test.mjs
          node --experimental-default-type=module --check webapp/js/persistence_authority_test.mjs
          node --experimental-default-type=module --check webapp/js/gacha_controller.js
          node --experimental-default-type=module --check webapp/js/gacha_controller_runtime.js
          node --experimental-default-type=module --check webapp/js/gacha_player_meta_integration.js
          node --experimental-default-type=module --check webapp/js/gacha_player_meta_integration_test.mjs
          node --experimental-default-type=module --check webapp/js/player_meta_roster_integration.js
          node --experimental-default-type=module --check webapp/js/player_meta_roster_rehydration_test.mjs
          node --experimental-default-type=module --check webapp/js/gacha_player_meta_migration_test.mjs
          node --experimental-default-type=module --check webapp/js/team_manager.js
