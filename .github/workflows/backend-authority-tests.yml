name: BaseWarriors Backend Authority Tests

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "webapp/js/combat_core.js"
      - "webapp/js/reward_authority.js"
      - ".github/workflows/backend-authority-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate backend syntax
        run: |
          node --check src/config.mjs
          node --check src/errors.mjs
          node --check src/auth.mjs
          node --check src/combat_store.mjs
          node --check src/persistent_combat_store.mjs
          node --check src/combat_service.mjs
          node --check src/attestation_signer.mjs
          node --check src/server.mjs
      - name: Backend authority tests
        run: npm test

      - name: Build backend container smoke image
        run: |
          docker buildx build             --ignorefile backend/.dockerignore             --platform linux/amd64             --load             --tag basewarriors-authority:test             --file backend/Dockerfile             .
      - name: Run backend container smoke check
        run: |
          docker run -d --rm             --name basewarriors-authority-smoke             -e NODE_ENV=test             -p 8787:8787             basewarriors-authority:test
          trap 'docker rm -f basewarriors-authority-smoke >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8787/health >/tmp/basewarriors-health.json; then
              break
            fi
            sleep 1
          done
          grep -q '"ok":true' /tmp/basewarriors-health.json
          docker exec basewarriors-authority-smoke sh -c 'test ! -e /app/.env && test ! -e /app/.env.production && test ! -e /app/private.key'
