name: Narrative Tests

on:
  push:
    branches:
      - main
    paths:
      - "webapp/js/narrative_*.js"
      - "webapp/js/narrative_*.mjs"
      - "webapp/js/reaction_rules.js"
      - "webapp/js/reaction_rules_test.mjs"
      - "webapp/js/voice_system.js"
      - ".github/workflows/narrative-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  narrative-tests:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run narrative unit and integration tests
        shell: bash
        run: |
          set -euo pipefail
          node --version
          node --experimental-default-type=module webapp/js/reaction_rules_test.mjs
          node --experimental-default-type=module webapp/js/narrative_runtime_test.mjs
          node --experimental-default-type=module webapp/js/narrative_presentation_test.mjs
          node --experimental-default-type=module webapp/js/narrative_team11_test.mjs
          node --experimental-default-type=module webapp/js/narrative_team11_choice_test.mjs
          node --experimental-default-type=module webapp/js/contract_test.mjs

      - name: Validate narrative syntax
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-default-type=module --check webapp/js/narrative_runtime.js
          node --experimental-default-type=module --check webapp/js/narrative_presentation.js
          node --experimental-default-type=module --check webapp/js/narrative_arc0_team11_choice.js
          node --experimental-default-type=module --check webapp/js/narrative_team11_choice_presentation.js
          node --experimental-default-type=module --check webapp/js/reaction_rules.js
          node --experimental-default-type=module --check webapp/js/voice_system.js
