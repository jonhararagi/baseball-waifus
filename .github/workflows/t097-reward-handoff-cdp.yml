name: T097 Local Demo Reward Boundary CDP QA

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - "webapp/js/character_journey_browser_probe.mjs"
      - "webapp/js/app.js"
      - "webapp/js/combat.js"
      - "webapp/js/reward_pipeline.js"
      - "webapp/js/reward_authority.js"
      - "webapp/js/bone004_reward_authority_test.mjs"
      - "webapp/js/bone004_browser_probe.mjs"
      - "backend/src/combat_service.mjs"
      - "backend/src/combat_store.mjs"
      - "backend/src/attestation_signer.mjs"
      - "backend/test/attestation_compatibility_test.mjs"
      - "webapp/js/reward_resolver.js"
      - "webapp/js/player_meta_reward_adapter.js"
      - "webapp/js/player_meta_state.js"
      - "webapp/js/player_meta_persistence_adapter.js"
      - "webapp/js/gacha_player_meta_integration.js"
      - "webapp/js/gacha_controller.js"
      - "webapp/index.html"
      - ".github/workflows/t097-reward-handoff-cdp.yml"
  workflow_dispatch:

jobs:
  t097-reward-handoff-cdp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Prepare static site for browser probes
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site
          cp -R webapp/. site/

          mkdir -p site/assets/characters/expressions site/assets/characters/approved
          cp -R assets/characters/expressions/. site/assets/characters/expressions/
          cp -R assets/characters/approved/. site/assets/characters/approved/

          mkdir -p site/data
          cp data/characters_queue.json site/data/characters_queue.json
          cp data/game_schemas_recycled.json site/data/game_schemas_recycled.json
          test -s site/data/characters_queue.json
          test -s site/data/game_schemas_recycled.json
          test -s site/assets/characters/expressions/bw001_neutral.svg

          mkdir -p site/assets/production
          cp -R assets/production/. site/assets/production/
          test -s site/assets/production/cards/bw001--normal.svg
          test -s site/assets/production/sprites/bw001_idle.png
          test -s site/assets/production/presentation/bw001--profile.svg
          test -s site/assets/production/presentation/bw001--victory.svg

          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("site/assets/production")
          allowed = {".png", ".jpg", ".jpeg", ".webp", ".avif", ".svg"}

          def collect(folder):
              items = []
              base = root / folder
              for path in sorted(base.rglob("*")):
                  if path.is_file() and path.suffix.lower() in allowed:
                      descriptor = {
                          "id": path.stem,
                          "path": "./assets/production/%s" % path.relative_to(root).as_posix()
                      }
                      descriptor["card_hd_url" if folder == "cards" else "sprite_url"] = descriptor["path"]
                      items.append(descriptor)
              return items

          manifest = {"version": 2, "sprites": collect("sprites"), "cards": collect("cards")}
          (root / "manifest.json").write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\\n", encoding="utf-8")
          PY
          test -s site/assets/production/manifest.json

      - name: Validate and instrument temporary site for BWM-101-R7-C2
        shell: bash
        run: |
          set -euo pipefail
          node --test tools/qa/instrument-browser-site.test.mjs
          node tools/qa/instrument-browser-site.mjs site
          node --input-type=module -e 'import { readFileSync } from "node:fs"; const m=JSON.parse(readFileSync("site/bwm-101-r5-instrumentation-manifest.json","utf8")); if (m.status !== "PASS" || m.harnessVersion !== "BWM-101-R7-C2" || m.checks.length !== 13 || m.checks.some(x => !x.passed)) throw new Error("BWM-101-R7-C2 manifest validation failed"); console.log("BWM101R5 MANIFEST PASS", JSON.stringify({version:m.harnessVersion,checks:m.checks.length}));'

      - name: Locate Chrome
        id: chrome
        shell: bash
        run: |
          set -euo pipefail
          BROWSER_BIN=""
          for candidate in google-chrome chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then
              BROWSER_BIN="$(command -v "$candidate")"
              break
            fi
          done
          test -n "$BROWSER_BIN"
          echo "browser_bin=$BROWSER_BIN" >> "$GITHUB_OUTPUT"
      - name: Validate T097 probe syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check webapp/js/character_journey_browser_probe.mjs
      - name: BONE-004 Reward Authority Contract
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-default-type=module --check webapp/js/reward_authority.js
          node --experimental-default-type=module webapp/js/bone004_reward_authority_test.mjs
          node --test backend/test/attestation_compatibility_test.mjs
      - name: BONE-004 Native Chromium Reward Authority Validation
        shell: bash
        env:
          SITE_DIR: site
          BROWSER_BIN: ${{ steps.chrome.outputs.browser_bin }}
        run: |
          set -euo pipefail
          mkdir -p browser-evidence/BONE-004
          node webapp/js/bone004_browser_probe.mjs | tee browser-evidence/BONE-004/bone004-browser-output.txt
      - name: Upload BONE-004 browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bone004-reward-authority-browser-evidence
          path: browser-evidence/BONE-004/
          if-no-files-found: warn
      - name: Run T097 local demo reward-blocking proof
        shell: bash
        env:
          T072_SITE_DIR: site
          T072_EVIDENCE_DIR: browser-evidence/T097/$GITHUB_SHA/$GITHUB_RUN_ID
          T097_REWARD_HANDOFF: "1"
          BROWSER_BIN: ${{ steps.chrome.outputs.browser_bin }}
        run: |
          set -euo pipefail
          mkdir -p "$T072_EVIDENCE_DIR"
          node webapp/js/character_journey_browser_probe.mjs
      - name: Run T101 normal combat defeat proof
        if: always()
        shell: bash
        env:
          T072_SITE_DIR: site
          T072_EVIDENCE_DIR: browser-evidence/T101/$GITHUB_SHA/$GITHUB_RUN_ID
          BWM101R5_TASK: T101
          BWM101R5_EVIDENCE_ROOT: browser-evidence/BWM-101-R7-C2/T101
          T101_DEFEAT_PROOF: "1"
          T104_PERSISTENCE_PROOF: "1"
          BROWSER_BIN: ${{ steps.chrome.outputs.browser_bin }}
        run: |
          set -euo pipefail
          mkdir -p "$T072_EVIDENCE_DIR"
          node webapp/js/character_journey_browser_probe.mjs

      - name: Run T109 mid-turn reward boundary proof
        if: always()
        shell: bash
        env:
          T072_SITE_DIR: site
          T072_EVIDENCE_DIR: browser-evidence/T109/$GITHUB_SHA/$GITHUB_RUN_ID
          T109_REWARD_BOUNDARY: "1"
          BROWSER_BIN: ${{ steps.chrome.outputs.browser_bin }}
        run: |
          set -euo pipefail
          mkdir -p "$T072_EVIDENCE_DIR"
          node webapp/js/character_journey_browser_probe.mjs

      - name: Run T111 terminal reward boundary proof
        if: always()
        shell: bash
        env:
          T072_SITE_DIR: site
          T072_EVIDENCE_DIR: browser-evidence/T111/$GITHUB_SHA/$GITHUB_RUN_ID
          T111_TERMINAL_BOUNDARY: "1"
          BROWSER_BIN: ${{ steps.chrome.outputs.browser_bin }}
        run: |
          set -euo pipefail
          mkdir -p "$T072_EVIDENCE_DIR"
          node webapp/js/character_journey_browser_probe.mjs

      - name: Run T117 terminal timing diagnostic
        if: always()
        shell: bash
        env:
          T072_SITE_DIR: site
          T072_EVIDENCE_DIR: browser-evidence/T117/$GITHUB_SHA/$GITHUB_RUN_ID
          T117_TERMINAL_TIMING_DIAGNOSTIC: "1"
          BROWSER_BIN: ${{ steps.chrome.outputs.browser_bin }}
        run: |
          set -euo pipefail
          mkdir -p "$T072_EVIDENCE_DIR"
          node webapp/js/character_journey_browser_probe.mjs

      - name: Upload T117 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t117-terminal-timing-diagnostic-evidence
          path: browser-evidence/T117/
          if-no-files-found: warn

      - name: Run T118 non-hit terminal reward validation
        if: always()
        shell: bash
        env:
          T072_SITE_DIR: site
          T072_EVIDENCE_DIR: browser-evidence/T118/$GITHUB_SHA/$GITHUB_RUN_ID
          BWM101R5_TASK: T118
          BWM101R5_EVIDENCE_ROOT: browser-evidence/BWM-101-R7-C2/T118
          T118_NON_HIT_REWARD_VALIDATION: "1"
          BROWSER_BIN: ${{ steps.chrome.outputs.browser_bin }}
        run: |
          set -euo pipefail
          mkdir -p "$T072_EVIDENCE_DIR"
          node webapp/js/character_journey_browser_probe.mjs

      - name: Upload T118 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t118-non-hit-reward-browser-evidence
          path: browser-evidence/T118/
          if-no-files-found: warn

      - name: Run T114-R2 historical T096 terminal timing recovery
        if: always()
        shell: bash
        env:
          T072_SITE_DIR: site
          T072_EVIDENCE_DIR: browser-evidence/T114-R/$GITHUB_SHA/$GITHUB_RUN_ID
          T114R_TERMINAL_INPUT_RECOVERY: "1"
          BROWSER_BIN: ${{ steps.chrome.outputs.browser_bin }}
        run: |
          set -euo pipefail
          mkdir -p "$T072_EVIDENCE_DIR"
          node webapp/js/character_journey_browser_probe.mjs

      - name: Upload T114-R evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t114-r-terminal-timing-recovery-evidence
          path: browser-evidence/T114-R/
          if-no-files-found: warn

      - name: Upload T111 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t111-terminal-reward-boundary-browser-evidence
          path: browser-evidence/T111/
          if-no-files-found: warn
      - name: Upload T109 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t109-mid-turn-reward-browser-evidence
          path: browser-evidence/T109/
          if-no-files-found: warn

      - name: Upload T101 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t101-defeat-browser-cdp-evidence
          path: browser-evidence/T101/
          if-no-files-found: warn
      - name: Upload BWM-101-R7-C2 causal traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bwm-101-r7-c2-causal-traces
          path: browser-evidence/BWM-101-R7-C2/
          if-no-files-found: error
      - name: Upload T097 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t097-reward-handoff-cdp-evidence
          path: browser-evidence/T097/
          if-no-files-found: warn
