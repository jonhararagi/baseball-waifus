  webapp-p1-p10-unit-tests:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate PWA manifest and service worker syntax
        shell: bash
        run: |
          set -euo pipefail
          node -e 'JSON.parse(require("fs").readFileSync("webapp/manifest.json", "utf8")); console.log("manifest.json: ok")'
          node --check webapp/sw.js
      - name: Node syntax checks
        shell: bash
        run: |
          set -euo pipefail
          find webapp/js -maxdepth 1 -name "*.js" -print0 | while IFS= read -r -d "" file; do
            node --experimental-default-type=module --check "$file"
          done
      - name: Run accumulated frontend unit tests P1-P10
        shell: bash
        run: |
          set -euo pipefail
          tests=(
            webapp/js/area_theme_test.mjs
            webapp/js/audio_bridge_test.mjs
            webapp/js/audio_engine_test.mjs
            webapp/js/batter_renderer_test.mjs
            webapp/js/combat_effects_test.mjs
            webapp/js/contract_test.mjs
            webapp/js/economy_test.mjs
            webapp/js/gacha_controller_test.mjs
            webapp/js/gacha_engine_test.mjs
            webapp/js/game_modes_test.mjs
            webapp/js/mobile_haptics_test.mjs
            webapp/js/performance_adapter_test.mjs
            webapp/js/save_system_test.mjs
            webapp/js/super_swing_cutin_test.mjs
            webapp/js/team_manager_test.mjs
            webapp/js/tma_bridge_test.mjs
            webapp/js/upgrade_system_test.mjs
            webapp/js/waifu_dex_test.mjs
            webapp/js/e2e_smoke_test.mjs
          )
          for test_file in "${tests[@]}"; do
            echo "==> ${test_file}"
            node --experimental-default-type=module "${test_file}"
          done

  p10-release-gate:
    needs: webapp-p1-p10-unit-tests
    runs-on: ubuntu-22.04
    steps:
      - name: RC1 release gate
        run: echo "P10 frontend validation passed; release may proceed to GitHub Pages."
