name: T079 Character-Combat 2.5D Browser QA
on:
  push:
    branches:
      - main
    paths:
      - "webapp/js/combat.js"
      - "webapp/js/combat_stage.js"
      - "webapp/js/combat_presentation_director.js"
      - "webapp/js/character_journey_browser_probe.mjs"
      - "webapp/js/combat_stage_t079_test.mjs"
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Prepare runtime data
        run: |
          set -euo pipefail
          mkdir -p webapp/data
          cp data/characters_queue.json webapp/data/characters_queue.json
          cp data/game_schemas_recycled.json webapp/data/game_schemas_recycled.json
      - name: Locate Chrome
        id: chrome
        run: |
          set -euo pipefail
          for candidate in google-chrome chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then
              echo "browser_bin=$(command -v "$candidate")" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          exit 1
      - name: Run T079 real browser proof
        env:
          T072_SITE_DIR: webapp
          T072_EVIDENCE_DIR: browser-evidence/T079/${{ github.sha }}/${{ github.run_id }}
          T079_STAGE: "1"
          BROWSER_BIN: ${{ steps.chrome.outputs.browser_bin }}
        run: |
          set -euo pipefail
          mkdir -p "$T072_EVIDENCE_DIR"
          node --check webapp/js/character_journey_browser_probe.mjs
          node webapp/js/character_journey_browser_probe.mjs
      - name: Upload T079 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t079-character-combat-browser-evidence
          path: browser-evidence/T079/
          if-no-files-found: warn
