name: T080 Character Combat Cinematic Action CI
on:
  push:
    branches:
      - main
    paths:
      - "webapp/js/combat.js"
      - "webapp/js/app.js"
      - "webapp/js/combat_stage.js"
      - "webapp/js/combat_presentation_director.js"
      - "webapp/js/batter_renderer.js"
      - "webapp/js/combat_action_t080_test.mjs"
  workflow_dispatch:
jobs:
  t080:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax and cinematic action contract
        run: |
          set -euo pipefail
          node --check webapp/js/combat_stage.js
          node --check webapp/js/combat_presentation_director.js
          node --check webapp/js/batter_renderer.js
          node --check webapp/js/combat.js
          node --check webapp/js/app.js
          node --check webapp/js/combat_action_t080_test.mjs
          node webapp/js/combat_action_t080_test.mjs
