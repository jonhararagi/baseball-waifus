<svg xmlns="http://www.w3.org/2000/svg" width="768" height="768" viewBox="0 0 768 768">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0.92" y2="1">
    <stop offset="0" stop-color="#26182a"/>
    <stop offset="0.62" stop-color="#3d2028"/>
    <stop offset="1" stop-color="#8f3a31"/>
  </linearGradient>
  <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#77422e"/>
    <stop offset="0.55" stop-color="#5a3327"/>
    <stop offset="1" stop-color="#3b211d"/>
  </linearGradient>
  <linearGradient id="jacket" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fff8e9"/>
    <stop offset="1" stop-color="#e9dfca"/>
  </linearGradient>
  <radialGradient id="skin" cx="42%" cy="34%" r="68%">
    <stop offset="0" stop-color="#f0c3a4"/>
    <stop offset="1" stop-color="#c98161"/>
  </radialGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="10"/>
  </filter>
</defs>

<rect width="768" height="768" rx="68" fill="url(#bg)"/>
