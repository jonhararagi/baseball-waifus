<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Student 4v4 Presentation Demo</title>
<style>
:root{color-scheme:dark;font-family:Arial,sans-serif;background:#070a13;color:#e9f8ff}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 20%,#15122b 0,#070a13 65%)}
#app{width:min(920px,94vw)}.card{border:1px solid #00eaff;background:#0b1020;padding:24px;box-shadow:0 0 40px #00eaff22}
header{display:flex;justify-content:space-between;align-items:end;gap:16px}.kicker{color:#00eaff;font-size:12px;letter-spacing:.16em}h1{margin:5px 0 0;font-size:30px}
.current{margin:18px 0;padding:14px;border-left:3px solid #ff3df2;background:#111525}.current b{color:#ff3df2}
.roles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.role{border:1px solid #26314c;padding:16px;background:#0a0f1d}.role.active{border-color:#ff3df2}.role.complete{border-color:#00eaff}.role strong,.role span,.role small{display:block}.role span{margin-top:8px;font-size:20px}.role small{margin-top:5px;color:#91a4b7}
.flow{margin:18px 0;padding:12px;border:1px dashed #26314c;text-align:center;color:#91a4b7;font-size:12px}.readout{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.readout span{padding:14px;background:#111525}.readout b{display:block;margin-top:4px}.actions{display:flex;gap:10px;margin-top:18px}.actions button{flex:1;padding:14px;border:1px solid #00eaff;background:#11192b;color:#e9f8ff;font-weight:800;cursor:pointer}.actions button:last-child{border-color:#ff3df2}.note{margin-top:12px;color:#91a4b7;font-size:12px}.events{margin-top:12px;color:#91a4b7;font-size:12px}
@media(max-width:600px){header{display:block}.roles{grid-template-columns:repeat(2,1fr)}.readout{grid-template-columns:1fr 1fr}.actions{flex-direction:column}}
</style>
</head>
<body><main id="app"></main>
<script type="module">
import { Student4v4Integration } from "./js/student_4v4_integration.js";
import { Student4v4PresentationOrchestrator } from "./js/student_4v4_presentation_orchestrator.js";

const app=document.querySelector("#app");
const flow=new Student4v4Integration({seed:"T044-DEMO-001",team:{id:"student-demo-team"}});
const presentation=new Student4v4PresentationOrchestrator();

function render(){
 const s=flow.snapshot();
 const view=presentation.update(s);
 const m=view.presentation;
 const roles=m.roles.map(function(entry){
   const result=m.roleResults[entry.role];
   const value=result ? (entry.role==="BUFFER"?result.energy_points:entry.role==="HEALER"?result.protectedPoints:entry.role==="DEBUFFER"?result.disruptionPoints:result.impactPoints) : 0;
   return '<article class="role '+(entry.active?'active ':'')+(entry.completed?'complete':'')+'"><strong>'+entry.role+'</strong><span>'+(entry.completed?'DONE':'READY')+'</span><small>'+entry.status.toUpperCase()+(entry.completed?' · +'+value:'')+'</small></article>';
 }).join("");
 const r=m.student4v4Result;
 const current=m.activeRole||m.phase;
 const label=m.phase==="INIT"?"START":m.phase==="COMPLETE"?"DONE":m.phase==="RESOLUTION"?"RESOLVE":"EXECUTE "+m.activeRole;
 const events=view.events.map(function(event){return event.type+(event.role?" / "+event.role:"");}).join(" · ")||"NO PRESENTATION EVENTS";
 app.innerHTML='<section class="card"><header><div><span class="kicker">BASEWARRIORS // STUDENT 4V4</span><h1>PRESENTATION ORCHESTRATION</h1></div><strong>'+current+'</strong></header><div class="current">PRESENTATION STATE <b>'+m.phase+'</b> · SEED <b>'+m.seed+'</b></div><div class="roles">'+roles+'</div><div class="flow">GAMEPLAY STATE → PRESENTATION MODEL → UI / RENDERER</div><div class="readout"><span>SCORE<b>'+(r?r.combinedScore:0)+'</b></span><span>ACCURACY<b>'+(r?r.combinedAccuracy:0)+'%</b></span><span>RESOLVED<b>'+String(m.resolved)+'</b></span><span>COMPLETE<b>'+String(m.completed)+'</b></span></div><div class="actions"><button id="next">'+label+'</button><button id="restart">RESTART</button></div><div class="events">EVENTS: '+events+'</div><div class="note">Development fixture: the UI consumes the Student4v4PresentationOrchestrator snapshot. It does not calculate gameplay, score, timing, RNG, or combat results.</div></section>';
 document.querySelector("#next").onclick=function(){if(m.phase==="INIT")flow.start();else if(m.phase!=="RESOLUTION"&&m.phase!=="COMPLETE")flow.completeCurrentRolePerfect();else if(m.phase==="RESOLUTION")flow.advance();render();};
 document.querySelector("#restart").onclick=function(){flow.reset();presentation.reset();render();};
}
render();
</script>
</body></html>
