<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Student 4v4 Integrated UI</title>
<style>
:root{color-scheme:dark;font-family:Arial,sans-serif;background:#070a13;color:#e9f8ff}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px;background:radial-gradient(circle at 50% 10%,#15122b 0,#070a13 65%)}
#app{width:min(980px,100%)}.s4-shell{border:1px solid #00eaff;background:linear-gradient(145deg,#0b1020,#080b16);padding:20px;box-shadow:0 0 40px #00eaff22}
.s4-header{display:flex;justify-content:space-between;align-items:end;gap:16px}.s4-kicker,.s4-label,.s4-section-title{color:#00eaff;font-size:11px;letter-spacing:.14em}.s4-header h1{margin:5px 0 0;font-size:28px}.s4-phase{color:#ff3df2;font-weight:900}
.s4-meta{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}.s4-meta span,.s4-metrics span{padding:9px 11px;background:#111525;border:1px solid #26314c;font-size:11px}.s4-meta b{color:#fff}
.s4-section{margin-top:14px}.s4-section-title{margin-bottom:7px}.s4-roles{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.s4-role{padding:13px;border:1px solid #26314c;background:#0a0f1d;min-width:0}.s4-role.is-active{border-color:#ff3df2;box-shadow:0 0 16px #ff3df222}.s4-role.is-complete{border-color:#00eaff}.s4-role-top{display:flex;justify-content:space-between;gap:6px;align-items:center}.s4-role strong{font-size:12px}.s4-status{font-size:9px;color:#91a4b7}.s4-role.is-active .s4-status{color:#ff3df2}.s4-role.is-complete .s4-status{color:#00eaff}.s4-role small{display:block;margin-top:8px;color:#91a4b7;font-size:10px}
.s4-active{margin-top:14px;padding:15px;border-left:3px solid #ff3df2;background:#111525}.s4-active-copy{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}.s4-active-copy strong{font-size:20px;color:#ff3df2}.s4-active-copy span:last-child{color:#91a4b7;font-size:11px}.s4-flow{margin-top:10px;color:#91a4b7;font-size:10px}
.s4-panel-copy{padding:13px;background:#0a0f1d;border:1px solid #26314c;color:#91a4b7;font-size:12px;line-height:1.45}
.s4-metrics{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}.s4-metrics span{display:block;color:#91a4b7}.s4-metrics b{display:block;margin-top:5px;color:#fff;font-size:15px}.s4-complete{padding:15px;border:1px solid #00eaff;background:#0a0f1d}.s4-complete strong,.s4-complete span,.s4-complete small{display:block}.s4-complete strong{margin-top:4px}.s4-complete span{margin-top:6px;color:#00eaff}.s4-complete small{margin-top:4px;color:#91a4b7}.s4-events{margin-top:12px;color:#91a4b7;font-size:10px;min-height:16px}
.s4-controls{display:flex;gap:8px;margin-top:14px}.s4-controls button{flex:1;padding:12px;border:1px solid #00eaff;background:#11192b;color:#e9f8ff;font-weight:900;cursor:pointer}.s4-controls button:last-child{border-color:#ff3df2}
@media(max-width:700px){.s4-roles{grid-template-columns:repeat(2,1fr)}.s4-metrics{grid-template-columns:repeat(2,1fr)}.s4-header{display:block}.s4-phase{margin-top:8px}.s4-controls{flex-direction:column}}
@media(max-width:380px){body{padding:9px}.s4-shell{padding:13px}.s4-header h1{font-size:22px}.s4-meta{display:grid;grid-template-columns:1fr 1fr}}
.s4-buffer-surface{margin-top:14px}.buffer-demo-card{padding:15px;border:1px solid #00eaff;background:#09101c}.buffer-demo-card header{display:flex;justify-content:space-between;align-items:end;gap:12px}.buffer-demo-card h2{margin:4px 0 0;color:#fff}.buffer-kicker{color:#00eaff;font-size:10px;letter-spacing:.14em}.buffer-status{display:flex;justify-content:space-between;gap:8px;margin-top:10px;color:#91a4b7;font-size:10px}.buffer-field{height:170px;margin-top:10px;display:grid;place-items:center;position:relative;overflow:hidden;background:radial-gradient(circle,#18253a,#070a13 68%);border:1px solid #26314c}.buffer-ring{width:120px;height:120px;border:2px solid #00eaff;border-radius:50%;display:grid;place-items:center;box-shadow:0 0 24px #00eaff44;animation:buffer-pulse 900ms ease-in-out infinite}.buffer-target{position:absolute;width:38px;height:38px;border:2px solid #ff3df2;border-radius:50%;box-shadow:0 0 16px #ff3df266}.buffer-note{position:relative;z-index:1;font-size:11px;font-weight:900;color:#fff;text-align:center}.buffer-lanes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.buffer-lane{padding:11px;border:1px solid #26314c;background:#111525;color:#e9f8ff;font-weight:900;cursor:pointer}.buffer-lane[data-buffer-lane="LIGHT"]{border-color:#7de7ff}.buffer-lane[data-buffer-lane="MEDIUM"]{border-color:#ffdf00}.buffer-lane[data-buffer-lane="HEAVY"]{border-color:#ff3df2}.buffer-lane:active{transform:scale(.98)}.buffer-result{display:flex;justify-content:space-between;gap:8px;margin-top:10px;padding:9px;background:#111525;border:1px solid #26314c}.buffer-result strong{color:#fff}.buffer-result span{color:#91a4b7;font-size:10px}.buffer-restart{margin-top:10px;width:100%;padding:10px;border:1px solid #ff3df2;background:#111525;color:#fff;font-weight:900;cursor:pointer}@keyframes buffer-pulse{0%,100%{transform:scale(.92);opacity:.75}50%{transform:scale(1);opacity:1}}@media(max-width:560px){.buffer-demo-card header,.buffer-status,.buffer-result{display:block}.buffer-status span,.buffer-result span{display:block;margin-top:4px}}
</style>
</head>
<body><main id="app"></main><div id="buffer-role-root" class="s4-buffer-surface"></div><div id="healer-role-root" class="s4-buffer-surface"></div>
<script type="module">
import { Student4v4BattleState } from "./js/student_4v4_battle_state.js";
import { Student4v4PresentationOrchestrator } from "./js/student_4v4_presentation_orchestrator.js";
import { Student4v4IntegratedUi } from "./js/student_4v4_ui.js";
import { BufferEnergyCreatorPresentation } from "./js/buffer_energy_creator_presentation.js";
import { Student4v4BufferInput } from "./js/student_4v4_buffer_input.js";
import { HealerDefensivePresentation } from "./js/healer_defensive_presentation.js";
import { Student4v4HealerInput } from "./js/student_4v4_healer_input.js";

const root=document.querySelector("#app");
const bufferRoot=document.querySelector("#buffer-role-root");
const healerRoot=document.querySelector("#healer-role-root");
const bufferPresentation=new BufferEnergyCreatorPresentation(bufferRoot);
const healerPresentation=new HealerDefensivePresentation(healerRoot);
const battle=new Student4v4BattleState({seed:"T048-UI-DEMO-001",battleId:"student-4v4-demo"});
const presentation=new Student4v4PresentationOrchestrator();
const ui=new Student4v4IntegratedUi(root);
const bufferInput=new Student4v4BufferInput({battle});
const healerInput=new Student4v4HealerInput({battle});
let healerFinalState=null;
let healerFinalResult=null;
let healerFrameId=0;

function perfectInput(){
 const state=battle.getCurrentRoleGame().getState();
 switch(battle.currentPhase){
  case "BUFFER":return {noteId:state.current_note.id,timestampMs:state.current_note.target_ms};
  case "HEALER":return {threatId:state.current_threat.id,zone:state.current_threat.zone,timestampMs:state.current_threat.target_ms};
  case "DEBUFFER":return {targetId:state.current_target.id,x:state.current_target.x,y:state.current_target.y,timestampMs:state.current_target.target_ms};
  case "BATTER":return {opportunityId:state.current_opportunity.id,timestampMs:state.current_opportunity.target_ms};
  default:throw new Error("NO_ACTIVE_ROLE");
 }
}
function renderBufferSurface(){
 if(battle.currentPhase!=="BUFFER"){
  bufferRoot.innerHTML="";
  return;
 }
 const roleState=battle.getCurrentRoleGame().getState();
 const response=bufferInput.getLastResponse();
 bufferPresentation.render({
  state: roleState,
  elapsedMs: bufferInput.elapsedMs(),
  lastGrade: response?.grade || response?.reason || "READY",
  result: roleState.completed ? battle.snapshot().roleResults.BUFFER : null
 });
 bufferPresentation.bind({
  onLane: (lane) => {
    bufferInput.submitLane(lane);
    update();
  },
  onRestart: () => {
    battle.reset();
    presentation.reset();
    bufferInput.reset();
    healerInput.reset();
    healerFinalState=null;
    healerFinalResult=null;
    update();
  }
 });
}

function ensureHealerStarted(){
 if(battle.currentPhase==="HEALER" && !healerInput.isActive()){
  healerInput.start();
 }
}

function renderHealerSurface(){
 if(battle.currentPhase!=="HEALER" && !healerFinalResult){
  healerRoot.innerHTML="";
  return;
 }

 const roleState=battle.currentPhase==="HEALER"
  ? battle.getCurrentRoleGame().getState()
  : healerFinalState;
 const response=healerInput.getLastResponse();
 const elapsed=battle.currentPhase==="HEALER" ? healerInput.elapsedMs() : 0;
 healerPresentation.render({
  state: roleState,
  elapsedMs: elapsed,
  lastGrade: response?.grade || response?.reason || "READY",
  result: healerFinalResult
 });
 healerPresentation.bind({
  onZone: (zone) => {
    const threat= battle.getCurrentRoleGame()?.getState?.()?.current_threat;
    if(!threat) return;
    const currentNow = healerInput.elapsedMs();
    const response=healerInput.submitThreat({
      threatId: threat.id,
      zone,
      timestampMs: currentNow
    });
    if(response.result){
      healerFinalState=response.state;
      healerFinalResult=response.result;
    }
    update();
  },
  onRestart: () => {
    battle.reset();
    presentation.reset();
    bufferInput.reset();
    healerInput.reset();
    healerFinalState=null;
    healerFinalResult=null;
    update();
  }
 });

 if(battle.currentPhase==="HEALER" && !healerFrameId){
  const frame=()=>{
    healerFrameId=0;
    if(battle.currentPhase!=="HEALER") return;
    renderHealerSurface();
    healerFrameId=requestAnimationFrame(frame);
  };
  healerFrameId=requestAnimationFrame(frame);
 }
}

function update(){
 ensureHealerStarted();
 const view=presentation.update(battle.snapshot());
 ui.render(view);
 renderBufferSurface();
 renderHealerSurface();
 const action=document.querySelector("#next");
 const restart=document.querySelector("#restart");
 action.onclick=()=>{
  if(battle.currentPhase==="INIT") bufferInput.start();
  else if(["DEBUFFER","BATTER"].includes(battle.currentPhase)){
   const role=battle.currentPhase;
   while(battle.currentPhase===role) battle.submitInput(perfectInput());
  } else if(battle.currentPhase==="RESOLUTION") battle.resolve();
  update();
 };
 restart.onclick=()=>{
  battle.reset();
  presentation.reset();
  bufferInput.reset();
  healerInput.reset();
  healerFinalState=null;
  healerFinalResult=null;
  if(healerFrameId){
    cancelAnimationFrame(healerFrameId);
    healerFrameId=0;
  }
  update();
 };
 const label=battle.currentPhase==="INIT"?"START BUFFER":battle.currentPhase==="BUFFER"?"INPUT BUFFER":battle.currentPhase==="HEALER"?"HEALER ACTIVE":battle.currentPhase==="RESOLUTION"?"RESOLVE":battle.currentPhase==="COMPLETE"?"COMPLETE":"EXECUTE "+battle.currentPhase;
 action.textContent=label;
 action.disabled=["BUFFER","HEALER","COMPLETE"].includes(battle.currentPhase);
}
update();
</script>
<div id="controls" style="position:fixed;left:12px;right:12px;bottom:12px;display:flex;gap:8px;justify-content:center;pointer-events:none"><button id="next" style="pointer-events:auto;min-width:180px;padding:12px;border:1px solid #00eaff;background:#11192b;color:#fff;font-weight:900">START</button><button id="restart" style="pointer-events:auto;min-width:120px;padding:12px;border:1px solid #ff3df2;background:#11192b;color:#fff;font-weight:900">RESTART</button></div>
</body></html>
