<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Student 4v4 Integration Demo</title>
<style>
:root{color-scheme:dark;font-family:Arial,sans-serif;background:#070a13;color:#e9f8ff}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 20%,#15122b 0,#070a13 65%)}
#app{width:min(920px,94vw)}.card{border:1px solid #00eaff;background:#0b1020;padding:24px;box-shadow:0 0 40px #00eaff22}
header{display:flex;justify-content:space-between;align-items:end;gap:16px}.kicker{color:#00eaff;font-size:12px;letter-spacing:.16em}h1{margin:5px 0 0;font-size:30px}
.current{margin:18px 0;padding:14px;border-left:3px solid #ff3df2;background:#111525}.current b{color:#ff3df2}
.roles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.role{border:1px solid #26314c;padding:16px;background:#0a0f1d}.role.complete{border-color:#00eaff}.role strong,.role span,.role small{display:block}.role span{margin-top:8px;font-size:20px}.role small{margin-top:5px;color:#91a4b7}
.flow{margin:18px 0;padding:12px;border:1px dashed #26314c;text-align:center;color:#91a4b7;font-size:12px}.readout{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.readout span{padding:14px;background:#111525}.readout b{display:block;margin-top:4px}.actions{display:flex;gap:10px;margin-top:18px}.actions button{flex:1;padding:14px;border:1px solid #00eaff;background:#11192b;color:#e9f8ff;font-weight:800;cursor:pointer}.actions button:last-child{border-color:#ff3df2}.note{margin-top:12px;color:#91a4b7;font-size:12px}
@media(max-width:600px){header{display:block}.roles{grid-template-columns:repeat(2,1fr)}.readout{grid-template-columns:1fr}.actions{flex-direction:column}}
</style>
</head>
<body><main id="app"></main>
<script type="module">
import { Student4v4Integration } from "./js/student_4v4_integration.js";
const app=document.querySelector("#app");
const flow=new Student4v4Integration({seed:"T042-DEMO-001",team:{id:"student-demo-team"}});
function render(){
 const s=flow.snapshot(),r=s.combinedResult,metrics={BUFFER:"energyContribution",HEALER:"protectionContribution",DEBUFFER:"disruptionContribution",BATTER:"impactContribution"};
 const roles=["BUFFER","HEALER","DEBUFFER","BATTER"].map(function(role){const done=Boolean(s.roleResults[role]);const value=r?r[metrics[role]]:0;return '<article class="role '+(done?'complete':'')+'"><strong>'+role+'</strong><span>'+(done?'+'+value:'READY')+'</span><small>'+(done?(s.roleResults[role].success?'SUCCESS':'FAILED'):'PENDING')+'</small></article>';}).join("");
 const current=s.phase==="RESULT"?"COMBINED RESULT":s.phase;
 const label=s.phase==="IDLE"?"START":s.phase==="RESULT"?"DONE":"EXECUTE "+s.phase;
 app.innerHTML='<section class="card"><header><div><span class="kicker">BASEWARRIORS // STUDENT 4V4</span><h1>PLAYABLE INTEGRATION</h1></div><strong>'+current+'</strong></header><div class="current">DETERMINISTIC SEED <b>'+s.seed+'</b></div><div class="roles">'+roles+'</div><div class="flow">PLAYER INPUT → ROLE GAMEPLAY → ROLE_RESULT → ORCHESTRATOR → COMBAT_RESULT</div><div class="readout"><span>SCORE<b>'+(r?r.combinedScore:0)+'</b></span><span>ACCURACY<b>'+(r?r.combinedAccuracy:0)+'%</b></span><span>STATUS<b>'+(r?'INTEGRATED':'IN PROGRESS')+'</b></span></div><div class="actions"><button id="next">'+label+'</button><button id="restart">RESTART</button></div><div class="note">Development fixture: EXECUTE uses the real role gameplay with deterministic perfect inputs. The UI does not calculate gameplay results.</div></section>';
 document.querySelector("#next").onclick=function(){if(s.phase==="IDLE")flow.start();else if(s.phase!=="RESULT")flow.completeCurrentRolePerfect();render();};
 document.querySelector("#restart").onclick=function(){flow.reset();render();};
}
render();
</script>
</body></html>
